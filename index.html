<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Project Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-dot" aria-hidden="true"></div>
          <div>
            <p class="brand-kicker">Jewelry Studio</p>
            <h1>Design Project Planner</h1>
          </div>
        </div>

        <nav class="topnav" aria-label="Primary">
          <button class="nav-link is-active" data-view="dashboard">Dashboard</button>
          <button class="nav-link" data-view="board">Board</button>
          <button class="nav-link" data-view="projects">Projects</button>
        </nav>
      </header>

      <main>
        <section id="dashboard-view" class="view is-active" aria-label="Dashboard view">
          <div class="overview-grid" id="overview-cards"></div>

          <section class="section-card">
            <div class="section-heading-row">
              <h2>Recent Projects</h2>
              <span class="muted">Most recently updated design work</span>
            </div>
            <div id="recent-projects" class="project-grid"></div>
          </section>
        </section>

        <section id="board-view" class="view" aria-label="Kanban board view">
          <section class="section-card">
            <div class="section-heading-row">
              <h2>Project Pipeline</h2>
              <span class="muted">Kanban overview by status</span>
            </div>
            <div id="kanban-board" class="kanban-board" aria-label="Kanban board"></div>
          </section>
        </section>

        <section id="projects-view" class="view" aria-label="Projects view">
          <section class="section-card">
            <div class="section-heading-row projects-controls">
              <div>
                <h2>All Projects</h2>
                <span class="muted">Explore and review every concept in the pipeline</span>
              </div>
              <div class="filters-wrap">
                <label class="search-input-wrap" for="search-input">
                  <span class="sr-only">Search projects</span>
                  <input
                    id="search-input"
                    type="search"
                    placeholder="Search by title, model number, assignee"
                  />
                </label>
                <div class="chip-row" id="status-chips"></div>
              </div>
            </div>

            <div id="all-projects" class="project-grid"></div>
          </section>
        </section>
      </main>
    </div>

    <aside id="detail-panel" class="detail-panel" aria-hidden="true">
      <div class="detail-backdrop" data-close-detail></div>
      <section class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <div class="detail-header">
          <button class="text-button" data-close-detail>← Back</button>
          <button class="icon-button" data-close-detail aria-label="Close detail panel">✕</button>
        </div>

        <div id="detail-content"></div>
      </section>
    </aside>

    <aside id="lightbox" class="lightbox" aria-hidden="true">
      <div class="lightbox-backdrop" data-close-lightbox></div>
      <section class="lightbox-content" role="dialog" aria-modal="true" aria-label="Image preview">
        <button class="icon-button" data-close-lightbox aria-label="Close image preview">✕</button>
        <img id="lightbox-image" src="" alt="Expanded project image" />
        <p id="lightbox-label"></p>
      </section>
    </aside>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
